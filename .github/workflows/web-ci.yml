name: Web Landing CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_test_scan:
    runs-on: ubuntu-latest
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Code Quality (ESLint)
        run: npm run lint

      - name: Security (NPM Audit)
        run: npm audit --audit-level=high || true

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          
      - name: Security Scan (Trivy FS)
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --format table .

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=false

      - name: Build Web Application
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: web:latest
          
      - name: Security Scan (Trivy Image)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --format table web:latest
